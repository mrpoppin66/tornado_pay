<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020907">
<title>TornadoPay</title>
<link rel="icon" href="tornado-logo.png">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="ambient" aria-hidden="true"></div>
<div id="topbar">
  <div class="brand-lockup">
    <img class="brand-logo" src="tornado-logo.png" alt="TornadoPay">
    <div class="brand-copy">
      <div id="topbar-title">Tornado<span>Pay</span></div>
      <div class="brand-caption">MINI APP</div>
    </div>
  </div>
  <button id="notif-btn" class="icon-btn" title="Уведомления" aria-label="Уведомления">
    <span class="bell-icon">◉</span><span id="notif-badge" class="badge" hidden>0</span>
  </button>
</div>

<div id="app"></div>

<nav id="bottom-nav">
  <a href="#/home" data-route="/home"><span class="nav-icon">⌂</span><span>Главная</span></a>
  <a href="#/services" data-route="/services"><span class="nav-icon">↗</span><span>Услуги</span></a>
  <a href="#/orders" data-route="/orders"><span class="nav-icon">≡</span><span>Заявки</span></a>
  <a href="#/balance" data-route="/balance"><span class="nav-icon">₮</span><span>Баланс</span></a>
  <a href="#/executor" data-route="/executor"><span class="nav-icon">◌</span><span>Кабинет</span></a>
</nav>

<script src="app.js"></script>
</body>
</html>
