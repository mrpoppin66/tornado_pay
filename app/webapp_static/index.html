<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a08">
<title>TornadoPay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
/* TornadoPay splash screen — заинлайнено, чтобы отрисоваться мгновенно,
   без лишнего сетевого запроса, пока грузится основной app.js/style.css. */
#tp-splash, #tp-splash * { box-sizing: border-box; }
.tp-splash {
  --tp-green: #2fe6a8;
  --tp-mint: #72f6cf;
  --tp-bg: #050a08;
  position: fixed; inset: 0; z-index: 99999; overflow: hidden;
  display: grid; place-items: center; isolation: isolate;
  padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  color: #eafff7; background: radial-gradient(ellipse at 50% 43%, #0b2920 0%, #07140f 39%, var(--tp-bg) 76%);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  opacity: 1; visibility: visible; transition: opacity .42s ease, visibility .42s ease;
}
.tp-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.tp-splash__ambient { position:absolute; inset:-30%; z-index:-1; pointer-events:none;
  background: repeating-radial-gradient(ellipse at 50% 50%, transparent 0 72px, rgba(47,230,168,.055) 74px 76px, transparent 79px 132px);
  transform: rotate(-16deg); animation: tp-drift 14s linear infinite; }
.tp-splash__ambient::before, .tp-splash__ambient::after { content:""; position:absolute; border:1px solid rgba(47,230,168,.16); border-radius:50%; transform:rotate(-24deg); }
.tp-splash__ambient::before { width:115vw; height:44vw; left:-10%; top:24%; box-shadow:0 0 34px rgba(47,230,168,.08), inset 0 0 30px rgba(47,230,168,.05); }
.tp-splash__ambient::after { width:100vw; height:32vw; right:-14%; bottom:17%; border-color:rgba(114,246,207,.12); }
.tp-splash__content { width:min(100%, 420px); display:flex; flex-direction:column; align-items:center; text-align:center; transform:translateY(-2vh); }
.tp-splash__mark { width:clamp(112px, 29vw, 156px); aspect-ratio:1; display:grid; place-items:center; margin-bottom:25px; position:relative; }
.tp-splash__mark::before { content:""; position:absolute; inset:0; border:1px solid rgba(114,246,207,.28); border-radius:32%; transform:rotate(45deg); box-shadow:0 0 48px rgba(47,230,168,.11), inset 0 0 28px rgba(47,230,168,.07); animation:tp-pulse 2.8s ease-in-out infinite; }
.tp-splash__logo { width:72%; height:72%; object-fit:contain; filter:drop-shadow(0 0 22px rgba(47,230,168,.32)); mix-blend-mode: screen; }
.tp-splash__wordmark { font-size:clamp(38px, 10vw, 54px); line-height:1; font-weight:850; letter-spacing:-2.5px; color:#f4fff9; }
.tp-splash__wordmark span { color:var(--tp-green); }
.tp-splash__tagline { margin:18px 0 0; font-size:11px; font-weight:700; letter-spacing:.22em; color:#8bb9a8; }
.tp-splash__loader { width:min(270px, 76vw); height:5px; margin-top:54px; border-radius:99px; overflow:hidden; background:#142820; box-shadow:0 0 0 1px rgba(114,246,207,.1); }
.tp-splash__loader span { display:block; width:36%; height:100%; border-radius:inherit; background:linear-gradient(90deg, #17c98d, #72f6cf); box-shadow:0 0 16px rgba(47,230,168,.75); animation:tp-load 1.55s cubic-bezier(.45,0,.55,1) infinite; }
.tp-splash__caption { margin-top:15px; color:#7fa89a; font-size:12px; letter-spacing:.04em; }
.tp-splash__bottom { position:absolute; bottom:max(25px, env(safe-area-inset-bottom)); display:flex; gap:7px; align-items:center; }
.tp-splash__bottom i { display:block; width:4px; height:4px; border-radius:50%; background:var(--tp-green); opacity:.28; animation:tp-dots 1.1s ease-in-out infinite; }
.tp-splash__bottom i:nth-child(2) { animation-delay:.15s; } .tp-splash__bottom i:nth-child(3) { animation-delay:.3s; }
@keyframes tp-load { 0%{transform:translateX(-110%)} 100%{transform:translateX(310%)} }
@keyframes tp-pulse { 0%,100%{opacity:.55;transform:rotate(45deg) scale(.96)} 50%{opacity:1;transform:rotate(45deg) scale(1.04)} }
@keyframes tp-drift { to{transform:rotate(344deg)} }
@keyframes tp-dots { 0%,80%,100%{opacity:.22;transform:translateY(0)} 40%{opacity:1;transform:translateY(-4px)} }
@media (prefers-reduced-motion: reduce) { .tp-splash *, .tp-splash::before { animation:none!important; transition:none!important; } }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="tp-splash" class="tp-splash" role="status" aria-label="Загрузка TornadoPay">
  <div class="tp-splash__ambient" aria-hidden="true"></div>
  <div class="tp-splash__content">
    <div class="tp-splash__mark">
      <img src="tornado-logo.png" alt="" class="tp-splash__logo">
    </div>
    <div class="tp-splash__wordmark">Tornado<span>Pay</span></div>
    <p class="tp-splash__tagline">ПЛАТЕЖИ. БЫСТРО. ПРОСТО.</p>
    <div class="tp-splash__loader" aria-hidden="true"><span></span></div>
    <div class="tp-splash__caption">Загружаем возможности</div>
  </div>
  <div class="tp-splash__bottom" aria-hidden="true"><i></i><i></i><i></i></div>
</div>
<script>
/* Скрывается вызовом window.TornadoPaySplash.hide() из app.js, когда первый
   экран уже отрисован; страховочный таймаут — если что-то пошло не так. */
(function () {
  var root = document.getElementById('tp-splash');
  if (!root) return;
  var hidden = false;
  function hide() {
    if (hidden) return;
    hidden = true;
    root.classList.add('is-hidden');
    window.setTimeout(function () { root.remove(); }, 500);
  }
  window.TornadoPaySplash = { hide: hide };
  window.setTimeout(hide, 9000);
})();
</script>
<div id="topbar">
  <div id="topbar-title"><img class="brand-logo" src="tornado-logo.png" alt="TornadoPay"><span>Tornado<span class="brand-accent">Pay</span></span></div>
  <button id="notif-btn" class="icon-btn" title="Уведомления" aria-label="Уведомления">
    <span class="icon-shell">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
    </span>
    <span id="notif-badge" class="badge" hidden>0</span>
  </button>
</div>

<div id="app"></div>

<nav id="bottom-nav">
  <a href="#/home" data-route="/home"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span>Главная</span></a>
  <a href="#/services" data-route="/services"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5zM8 8a4 4 0 0 1 8 0M8 12h.01M12 12h.01M16 12h.01"/></svg></span><span>Услуги</span></a>
  <a href="#/orders" data-route="/orders"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span>Заявки</span></a>
  <a href="#/balance" data-route="/balance"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 10h5v5h-5a2.5 2.5 0 0 1 0-5zM7 10h.01"/></svg></span><span>Баланс</span></a>
  <a href="#/executor" data-route="/executor"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5v6M13 8h6"/></svg></span><span>Кабинет</span></a>
</nav>

<script src="app.js"></script>
</body>
</html>
